name: Deploy static archive to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate generated pages and Naver verification
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path('.')
          pages = list(root.rglob('index.html'))
          assert len(pages) >= 17, f"Expected 17+ pages, got {len(pages)}"
          for page in pages:
              txt = page.read_text(encoding='utf-8')
              assert 'naver-site-verification' in txt, page
              assert '5de654028d35e953db53c015396e799f5c7ae12d' in txt, page
              assert '<main' in txt and '</html>' in txt, page
          assert pathlib.Path('CNAME').read_text().strip() == 'weapons.guidehollow.com'
          assert pathlib.Path('assets/site.js').exists()
          print(f'Validated {len(pages)} public HTML pages')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
