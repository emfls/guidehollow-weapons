name: Validate static archive changes
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression tests
        run: node --test tests/*.test.cjs
      - name: Check generated files
        run: node scripts/build.mjs --check
      - name: Static links, metadata, sources and counts
        run: python3 scripts/validate.py
      - name: JavaScript syntax
        run: |
          node --check assets/catalog-core.js
          node --check assets/site.js
          node --check assets/catalog.js
          node --check assets/editorial.js
