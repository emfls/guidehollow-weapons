name: Reframe illustrations and regenerate Pages markup
on:
  push:
    branches: [codex/weapons-discovery-comparison-20261107]
    paths: [scripts/normalize_media.py]
permissions:
  contents: write
jobs:
  reframe:
    if: github.ref == 'refs/heads/codex/weapons-discovery-comparison-20261107'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/weapons-discovery-comparison-20261107
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/normalize_media.py --apply
      - run: node scripts/build.mjs
      - run: |
          node --test tests/*.test.cjs
          node scripts/build.mjs --check
          python scripts/validate.py
          python scripts/normalize_media.py --check
      - name: Commit corrected images and generated pages to PR only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Normalize source images and regenerate checked pages"
            git push origin HEAD:codex/weapons-discovery-comparison-20261107
          fi
